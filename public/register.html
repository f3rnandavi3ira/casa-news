<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - CasaNews</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand text-danger" href="/"><i class="bi bi-buildings"></i> CasaNews</a>
      <a class="nav-link text-white" href="/">Accueil</a>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-7 col-lg-5">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h1 class="h3 mb-1">Creer un compte</h1>
            <p class="text-secondary mb-4">Rejoignez CasaNews pour sauvegarder vos articles.</p>
            <div class="alert alert-danger d-none" id="error-msg"></div>
            <form id="register-form">
              <div class="mb-3">
                <label class="form-label" for="name">Nom complet</label>
                <input class="form-control" type="text" id="name" placeholder="Votre nom" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" type="email" id="email" placeholder="votre@email.com" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="password">Mot de passe</label>
                <input class="form-control" type="password" id="password" placeholder="Min. 6 caracteres" required>
              </div>
              <button type="submit" class="btn btn-danger w-100">S'inscrire</button>
            </form>
            <p class="text-center text-secondary small mb-0 mt-3">
              Deja un compte ? <a href="/login.html">Se connecter</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
