<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editer un article - CasaNews</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/page-guard.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand text-danger" href="/"><i class="bi bi-buildings"></i> CasaNews</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Ouvrir la navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-nav">
        <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2" id="nav-links"></div>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h1 class="h3 mb-4">Editer un article</h1>
            <div class="alert d-none" id="form-message"></div>
            <form id="article-form">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="title">Titre</label>
                  <input class="form-control" id="title" name="title" type="text" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="imageUrl">Image</label>
                  <input class="form-control" id="imageUrl" name="imageUrl" type="url" required>
                </div>
                <div class="col-12">
                  <label class="form-label" for="description">Description</label>
                  <input class="form-control" id="description" name="description" type="text" required>
                </div>
                <div class="col-12">
                  <label class="form-label" for="content">Contenu</label>
                  <textarea class="form-control" id="content" name="content" rows="7"></textarea>
                </div>
              </div>
              <div class="d-flex justify-content-end gap-2 mt-4">
                <a class="btn btn-outline-secondary" href="/my-articles.html">Annuler</a>
                <button class="btn btn-danger" type="submit">Enregistrer</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/edit-article.js"></script>
</body>
</html>
