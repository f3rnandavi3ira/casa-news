<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon profil - CasaNews</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/page-guard.js"></script>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand text-danger" href="/">
        <i class="bi bi-buildings"></i> CasaNews
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Ouvrir la navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-nav">
        <div class="navbar-nav ms-auto align-items-lg-center gap-lg-2" id="nav-links"></div>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-7">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <div class="text-center mb-4">
              <div id="profile-avatar" class="bg-danger text-white rounded-circle d-inline-flex align-items-center justify-content-center fw-bold fs-4" style="width: 80px; height: 80px;"></div>
              <h1 class="h3 mt-3 mb-1">Mon profil</h1>
            </div>
            <div class="alert d-none" id="form-message"></div>
            <form id="profile-form">
              <div class="mb-3">
                <label class="form-label" for="name">Nom complet</label>
                <input class="form-control" type="text" id="name" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" type="email" id="email" required>
              </div>
              <hr class="my-4">
              <h2 class="h6 mb-3">Changer le mot de passe</h2>
              <div class="mb-3">
                <label class="form-label" for="password">Nouveau mot de passe</label>
                <input class="form-control" type="password" id="password" minlength="6">
              </div>
              <div class="mb-3">
                <label class="form-label" for="password-confirm">Confirmer le nouveau mot de passe</label>
                <input class="form-control" type="password" id="password-confirm" minlength="6">
              </div>
              <div class="d-flex justify-content-end gap-2 mt-4">
                <a class="btn btn-outline-secondary" href="/">Annuler</a>
                <button class="btn btn-danger" type="submit">Enregistrer</button>
              </div>
            </form>
          </div>
        </div>
        <div class="card border-danger mt-4">
          <div class="card-body p-4">
            <h2 class="h5 text-danger">Suppression du compte</h2>
            <p class="text-secondary">
              La suppression de votre compte est définitive.
              Vos articles et vos favoris seront également supprimés.
            </p>
            <button type="button" class="btn btn-outline-danger" id="delete-account-btn">
              <i class="bi bi-trash me-2"></i>Supprimer mon compte
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/profile.js"></script>

</body>
</html>
